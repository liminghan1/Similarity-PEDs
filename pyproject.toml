[project]
name = "structure-to-safety"
version = "0.1.0"
description = "Multimodal computational pharmacology of anabolic-androgenic steroids: molecular/receptor phenotype vs. FAERS adverse-event reporting phenotype."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "rdkit>=2024.3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
viz = [
    "umap-learn>=0.5",
    "plotly>=5.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100

[tool.uv]
# Research monorepo, not distributed as an installable package. `backend`/`analysis`
# modules are imported via `pythonpath = ["."]` above, so uv only needs to resolve
# and install dependencies, not build this project itself.
package = false
