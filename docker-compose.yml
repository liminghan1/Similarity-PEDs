services:
  db:
    image: postgres:16-alpine
    container_name: structure_to_safety_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-structure_to_safety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-structure_to_safety}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-structure_to_safety}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
